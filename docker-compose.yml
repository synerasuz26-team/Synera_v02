services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synera
      POSTGRES_USER: ${LOCAL_DB_USER:-synera}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-synera_local_only}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-local:/var/lib/postgresql/data
      - ./deploy/postgres-small-volume.conf:/etc/postgresql/postgresql.conf:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DB_ENVIRONMENT: dev
      DB_URL: jdbc:postgresql://db:5432/synera
      DB_USER: ${LOCAL_DB_USER:-synera}
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-synera_local_only}
      DB_POOL_SIZE: 5
      AUTH_JWT_SECRET: ${LOCAL_JWT_SECRET:-synera-local-only-not-for-any-environment-0123456789}
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      APP_JOBS_ENABLED: ${APP_JOBS_ENABLED:-true}
      FEATURE_PHOTOS: ${FEATURE_PHOTOS:-false}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    cpus: 1.0

volumes:
  postgres-local:
