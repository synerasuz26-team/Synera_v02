server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  profiles:
    active: ${APP_ENV:dev}
  application:
    name: synera-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  operations:
    enabled: ${OPERATIONS_ENABLED:true}
    database-warning-bytes: ${DB_WARNING_BYTES:350000000}
    database-critical-bytes: ${DB_CRITICAL_BYTES:425000000}
  files:
    photos-enabled: ${FEATURE_PHOTOS:false}
  jobs:
    enabled: ${APP_JOBS_ENABLED:true}
  auth:
    jwt-secret: ${JWT_SECRET:${AUTH_JWT_SECRET:}}
    refresh-token-days: ${AUTH_REFRESH_TOKEN_DAYS:30}
    login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${AUTH_LOGIN_LOCK_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}}
