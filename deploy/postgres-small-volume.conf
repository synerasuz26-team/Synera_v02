# Review against the actual Railway Postgres image/version before using as Start Command.
# This is a soft WAL budget, not a quota. Keep fsync/full_page_writes/synchronous_commit enabled.
# Example Start Command (only if supported by the Railway Postgres template):
# postgres -c max_wal_size=64MB -c min_wal_size=32MB -c wal_compression=on -c checkpoint_timeout=5min -c shared_buffers=64MB -c work_mem=2MB -c maintenance_work_mem=16MB -c max_connections=20
# Never change PGDATA, replace the Volume, remove pg_wal, or disable durability to free space.
listen_addresses = '*'
max_wal_size = 64MB
min_wal_size = 32MB
wal_compression = on
checkpoint_timeout = 5min
shared_buffers = 64MB
work_mem = 2MB
maintenance_work_mem = 16MB
max_connections = 20
autovacuum = on
log_min_duration_statement = -1
